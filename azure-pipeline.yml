trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '18.18.0'

stages:

# ============================================================
# BUILD STAGE
# ============================================================

- stage: Build
  displayName: 'Build SPFx Solution'

  jobs:

  - job: BuildSPFx
    displayName: 'Build SPFx'

    steps:

    # --------------------------------------------------------
    # Install Node.js
    # --------------------------------------------------------

    - task: NodeTool@0
      displayName: 'Install Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'


    # --------------------------------------------------------
    # Verify Node.js and npm
    # --------------------------------------------------------

    - script: |
        echo "Node version:"
        node --version

        echo ""
        echo "npm version:"
        npm --version
      displayName: 'Verify Node.js and npm'


    # --------------------------------------------------------
    # Install dependencies
    # --------------------------------------------------------

    - script: |
        npm install
      displayName: 'Install npm dependencies'


    # --------------------------------------------------------
    # Verify SPFx dependencies
    # --------------------------------------------------------

    - script: |
        echo "Gulp version:"
        npx gulp --version

        echo ""
        echo "SPFx build version:"
        npm ls @microsoft/sp-build-web

        echo ""
        echo "Gulp package:"
        npm ls gulp

        echo ""
        echo "TypeScript:"
        npm ls typescript
      displayName: 'Verify SPFx dependencies'


    # --------------------------------------------------------
    # Clean project
    # --------------------------------------------------------

    - script: |
        npx gulp clean
      displayName: 'Clean SPFx project'


    # --------------------------------------------------------
    # Bundle SPFx solution
    # --------------------------------------------------------

    - script: |
        npx gulp bundle --ship --verbose 2>&1 | tee gulp-bundle.log
        exit ${PIPESTATUS[0]}
      displayName: 'Bundle SPFx solution'
      env:
        NODE_OPTIONS: '--max-old-space-size=8192'


    # --------------------------------------------------------
    # Package SPFx solution
    # --------------------------------------------------------

    - script: |
        npx gulp package-solution --ship --verbose
      displayName: 'Package SPFx solution'
      env:
        NODE_OPTIONS: '--max-old-space-size=8192'


    # --------------------------------------------------------
    # Verify .sppkg package
    # --------------------------------------------------------

    - script: |
        echo "Searching for generated .sppkg files..."

        find "$(Build.SourcesDirectory)/sharepoint/solution" \
          -type f \
          -name "*.sppkg" \
          -print

        PACKAGE_COUNT=$(find "$(Build.SourcesDirectory)/sharepoint/solution" \
          -type f \
          -name "*.sppkg" | wc -l)

        if [ "$PACKAGE_COUNT" -eq 0 ]; then
          echo "ERROR: No .sppkg file was generated."
          exit 1
        fi

        echo ""
        echo "Found $PACKAGE_COUNT .sppkg package(s)."
      displayName: 'Verify SPFx package'


    # --------------------------------------------------------
    # Publish SPFx artifact
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish SPFx Artifact'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/sharepoint/solution'
        artifact: 'spfx-package'
        publishLocation: 'pipeline'


# ============================================================
# DEPLOY STAGE
# ============================================================

- stage: Deploy
  displayName: 'Deploy to SharePoint Tenant App Catalog'

  dependsOn: Build

  condition: succeeded()

  jobs:

  - job: DeploySPFx
    displayName: 'Deploy SPFx to Tenant App Catalog'

    steps:

    # --------------------------------------------------------
    # Download SPFx artifact
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download SPFx Artifact'
      inputs:
        artifact: 'spfx-package'
        path: '$(Pipeline.Workspace)/spfx-package'


    # --------------------------------------------------------
    # Locate .sppkg package
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Locate SPFx Package'
      inputs:
        targetType: 'inline'
        pwsh: true

        script: |

          $ErrorActionPreference = "Stop"

          Write-Host "Searching for SPFx package..."

          $package = Get-ChildItem `
            -Path "$(Pipeline.Workspace)/spfx-package" `
            -Filter "*.sppkg" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $package) {
              throw "ERROR: SPFx .sppkg package was not found."
          }

          Write-Host ""
          Write-Host "SPFx package found:"
          Write-Host $package.FullName
          Write-Host ""


    # --------------------------------------------------------
    # Install PnP.PowerShell
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Install PnP.PowerShell'
      inputs:
        targetType: 'inline'
        pwsh: true

        script: |

          $ErrorActionPreference = "Stop"

          Write-Host "Installing PnP.PowerShell..."

          Install-Module `
            -Name PnP.PowerShell `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

          Import-Module PnP.PowerShell

          Write-Host ""
          Write-Host "Installed PnP.PowerShell version:"

          Get-Module PnP.PowerShell -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object -First 1 Name, Version


    # --------------------------------------------------------
    # Download PFX certificate from Azure DevOps Secure Files
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: deploymentCertificate
      displayName: 'Download Entra ID Certificate'
      inputs:
        secureFile: 'spfx-deployment.pfx'


    # ========================================================
    # TEST CERTIFICATE AUTHENTICATION
    # ========================================================

    - task: PowerShell@2
      displayName: 'Test SharePoint Certificate Authentication'
      inputs:
        targetType: 'inline'
        pwsh: true

        script: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SharePoint Authentication Test"
          Write-Host "=========================================="

          # --------------------------------------------------
          # Configuration
          # --------------------------------------------------

          $appCatalogUrl = "$(AppCatalogUrl)"
          $clientId = "$(SharePointClientId)"
          $tenantId = "$(TenantId)"
          $certificatePath = "$(deploymentCertificate.secureFilePath)"

          Write-Host ""
          Write-Host "App Catalog URL:"
          Write-Host $appCatalogUrl

          Write-Host ""
          Write-Host "Client ID:"
          Write-Host $clientId

          Write-Host ""
          Write-Host "Tenant:"
          Write-Host $tenantId

          Write-Host ""
          Write-Host "Certificate:"
          Write-Host $certificatePath


          # --------------------------------------------------
          # Validate certificate file
          # --------------------------------------------------

          if (!(Test-Path $certificatePath)) {
              throw "Certificate file was not found: $certificatePath"
          }

          Write-Host ""
          Write-Host "Certificate file exists."


          # --------------------------------------------------
          # Create certificate password
          # --------------------------------------------------

          $certificatePassword = ConvertTo-SecureString `
            "$(CertificatePassword)" `
            -AsPlainText `
            -Force


          # --------------------------------------------------
          # Connect using Entra ID certificate
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Connecting to SharePoint..."

          $connection = Connect-PnPOnline `
            -Url $appCatalogUrl `
            -ClientId $clientId `
            -Tenant $tenantId `
            -CertificatePath $certificatePath `
            -CertificatePassword $certificatePassword `
            -ReturnConnection `
            -ValidateConnection


          Write-Host ""
          Write-Host "Authentication successful."


          # --------------------------------------------------
          # Test SharePoint site access
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Testing SharePoint site access..."

          $web = Get-PnPWeb `
            -Connection $connection `
            -ErrorAction Stop


          Write-Host ""
          Write-Host "SharePoint URL:"
          Write-Host $web.Url

          Write-Host ""
          Write-Host "SharePoint Title:"
          Write-Host $web.Title


          # --------------------------------------------------
          # Test Tenant App Catalog access
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Testing Tenant App Catalog access..."

          $apps = Get-PnPApp `
            -Scope Tenant `
            -Connection $connection `
            -ErrorAction Stop


          Write-Host ""
          Write-Host "Tenant App Catalog access successful."

          Write-Host ""
          Write-Host "Existing applications:"
          Write-Host $apps.Count


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Authentication Test PASSED"
          Write-Host "=========================================="


    # ========================================================
    # DEPLOY SPFX PACKAGE
    # ========================================================

    - task: PowerShell@2
      displayName: 'Deploy SPFx to Tenant App Catalog'
      inputs:
        targetType: 'inline'
        pwsh: true

        script: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SPFx Deployment"
          Write-Host "=========================================="


          # --------------------------------------------------
          # Configuration
          # --------------------------------------------------

          $appCatalogUrl = "$(AppCatalogUrl)"
          $clientId = "$(SharePointClientId)"
          $tenantId = "$(TenantId)"
          $certificatePath = "$(deploymentCertificate.secureFilePath)"


          # --------------------------------------------------
          # Find .sppkg package
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Locating SPFx package..."

          $package = Get-ChildItem `
            -Path "$(Pipeline.Workspace)/spfx-package" `
            -Filter "*.sppkg" `
            -Recurse |
            Select-Object -First 1


          if ($null -eq $package) {
              throw "ERROR: SPFx .sppkg package was not found."
          }


          Write-Host ""
          Write-Host "Package found:"
          Write-Host $package.FullName


          # --------------------------------------------------
          # Certificate password
          # --------------------------------------------------

          $certificatePassword = ConvertTo-SecureString `
            "$(CertificatePassword)" `
            -AsPlainText `
            -Force


          # --------------------------------------------------
          # Connect to SharePoint
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Connecting to SharePoint..."

          $connection = Connect-PnPOnline `
            -Url $appCatalogUrl `
            -ClientId $clientId `
            -Tenant $tenantId `
            -CertificatePath $certificatePath `
            -CertificatePassword $certificatePassword `
            -ReturnConnection `
            -ValidateConnection


          Write-Host ""
          Write-Host "Connected successfully."


          # --------------------------------------------------
          # Upload and publish SPFx package
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Uploading SPFx package..."

          Add-PnPApp `
            -Path $package.FullName `
            -Scope Tenant `
            -Overwrite `
            -Publish `
            -Connection $connection `
            -ErrorAction Stop


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "SPFx Deployment Completed Successfully"
          Write-Host "=========================================="