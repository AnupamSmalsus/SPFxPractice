trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '18.18.0'

stages:

# ============================================================
# BUILD STAGE
# ============================================================

- stage: Build
  displayName: 'Build SPFx Solution'

  jobs:
  - job: BuildSPFx
    displayName: 'Build SPFx'

    steps:

    # ----------------------------------------------------------
    # Install Node.js
    # ----------------------------------------------------------

    - task: NodeTool@0
      displayName: 'Install Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    # ----------------------------------------------------------
    # Verify Node / npm
    # ----------------------------------------------------------

    - script: |
        node --version
        npm --version
      displayName: 'Verify Node.js and npm'

    # ----------------------------------------------------------
    # Install dependencies
    # ----------------------------------------------------------

    - script: |
        npm install
      displayName: 'Install npm dependencies'

    # ----------------------------------------------------------
    # Verify SPFx dependencies
    # ----------------------------------------------------------

    - script: |
        echo "Gulp version:"
        npx gulp --version

        echo "SPFx build version:"
        npm ls @microsoft/sp-build-web

        echo "Gulp package:"
        npm ls gulp

        echo "TypeScript:"
        npm ls typescript
      displayName: 'Verify SPFx dependencies'

    # ----------------------------------------------------------
    # Clean previous build
    # ----------------------------------------------------------

    - script: |
        npx gulp clean
      displayName: 'Clean SPFx project'

    # ----------------------------------------------------------
    # Bundle SPFx solution
    # ----------------------------------------------------------

    - script: |
        npx gulp bundle --ship --verbose 2>&1 | tee gulp-bundle.log
        exit ${PIPESTATUS[0]}
      displayName: 'Bundle SPFx solution'
      env:
        NODE_OPTIONS: '--max-old-space-size=8192'

    # ----------------------------------------------------------
    # Package SPFx solution
    # ----------------------------------------------------------

    - script: |
        npx gulp package-solution --ship --verbose
      displayName: 'Package SPFx solution'
      env:
        NODE_OPTIONS: '--max-old-space-size=8192'

    # ----------------------------------------------------------
    # Verify .sppkg package
    # ----------------------------------------------------------

    - script: |
        echo "Searching for generated .sppkg files..."

        find "$(Build.SourcesDirectory)/sharepoint/solution" \
          -type f \
          -name "*.sppkg" \
          -print

        PACKAGE_COUNT=$(find "$(Build.SourcesDirectory)/sharepoint/solution" \
          -type f \
          -name "*.sppkg" | wc -l)

        if [ "$PACKAGE_COUNT" -eq 0 ]; then
          echo "ERROR: No .sppkg file was generated."
          exit 1
        fi

        echo "Found $PACKAGE_COUNT .sppkg package(s)."
      displayName: 'Verify SPFx package'

    # ----------------------------------------------------------
    # Publish SPFx package as pipeline artifact
    # ----------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish SPFx Artifact'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/sharepoint/solution'
        artifact: 'spfx-package'
        publishLocation: 'pipeline'


# ============================================================
# DEPLOY STAGE
# ============================================================

- stage: Deploy
  displayName: 'Deploy to SharePoint Tenant App Catalog'

  dependsOn:
    - Build

  condition: succeeded()

  jobs:
  - job: DeploySPFx
    displayName: 'Deploy SPFx'

    steps:

    # ----------------------------------------------------------
    # Download build artifact
    # ----------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download SPFx Artifact'
      inputs:
        artifact: 'spfx-package'
        path: '$(Pipeline.Workspace)/spfx-package'

    # ----------------------------------------------------------
    # Verify downloaded package
    # ----------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Verify SPFx Package'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |

          $ErrorActionPreference = "Stop"

          $packagePath = "$(Pipeline.Workspace)/spfx-package"

          Write-Host "Searching for .sppkg package..."

          $package = Get-ChildItem `
            -Path $packagePath `
            -Filter "*.sppkg" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $package) {
              throw "SPFx .sppkg package was not found."
          }

          Write-Host "SPFx package found:"
          Write-Host $package.FullName

    # ----------------------------------------------------------
    # Install PnP PowerShell
    # ----------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Install PnP PowerShell'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |

          $ErrorActionPreference = "Stop"

          Set-PSRepository `
            -Name PSGallery `
            -InstallationPolicy Trusted

          Install-Module `
            -Name PnP.PowerShell `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

          Import-Module PnP.PowerShell

          Write-Host "PnP PowerShell installed successfully."

          Write-Host "PnP PowerShell version:"
          Get-InstalledModule PnP.PowerShell

          Write-Host "Connect-PnPOnline:"
          Get-Command Connect-PnPOnline

          Write-Host "Add-PnPApp:"
          Get-Command Add-PnPApp

    # ----------------------------------------------------------
    # Test SharePoint authentication and permissions
    # ----------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Test SharePoint Connection'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |

          $ErrorActionPreference = "Stop"

          $appCatalogUrl = "$(AppCatalogUrl)"
          $clientId = "$(SharePointClientId)"
          $clientSecret = $env:SP_CLIENT_SECRET

          Write-Host "========================================"
          Write-Host "SharePoint Connection Test"
          Write-Host "========================================"

          Write-Host "App Catalog URL:"
          Write-Host $appCatalogUrl

          Write-Host "Client ID:"
          Write-Host $clientId

          if ([string]::IsNullOrWhiteSpace($appCatalogUrl)) {
              throw "AppCatalogUrl is empty."
          }

          if ([string]::IsNullOrWhiteSpace($clientId)) {
              throw "SharePointClientId is empty."
          }

          if ([string]::IsNullOrWhiteSpace($clientSecret)) {
              throw "SharePointClientSecret is empty."
          }

          Write-Host "Client secret is present."

          Write-Host "Connecting to SharePoint..."

          $connection = Connect-PnPOnline `
            -Url $appCatalogUrl `
            -ClientId $clientId `
            -ClientSecret $clientSecret `
            -ReturnConnection

          Write-Host "PnP connection created successfully."

          Write-Host "Testing SharePoint Web..."

          $web = Get-PnPWeb `
            -Connection $connection `
            -ErrorAction Stop

          Write-Host "SharePoint authentication successful."

          Write-Host "Connected URL:"
          Write-Host $web.Url

          Write-Host "Site Title:"
          Write-Host $web.Title

          Write-Host "Testing Tenant App Catalog access..."

          $apps = Get-PnPApp `
            -Scope Tenant `
            -Connection $connection `
            -ErrorAction Stop

          Write-Host "Tenant App Catalog access successful."

          Write-Host "Number of apps found:"
          Write-Host $apps.Count

      env:
        SP_CLIENT_SECRET: $(SharePointClientSecret)

    # ----------------------------------------------------------
    # Deploy SPFx package
    # ----------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Deploy SPFx to Tenant App Catalog'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |

          $ErrorActionPreference = "Stop"

          $appCatalogUrl = "$(AppCatalogUrl)"
          $clientId = "$(SharePointClientId)"
          $clientSecret = $env:SP_CLIENT_SECRET

          Write-Host "========================================"
          Write-Host "SPFx Tenant App Catalog Deployment"
          Write-Host "========================================"

          # ----------------------------------------------------
          # Find .sppkg
          # ----------------------------------------------------

          Write-Host "Searching for SPFx package..."

          $package = Get-ChildItem `
            -Path "$(Pipeline.Workspace)/spfx-package" `
            -Filter "*.sppkg" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $package) {
              throw "SPFx .sppkg package was not found."
          }

          Write-Host "Package found:"
          Write-Host $package.FullName

          # ----------------------------------------------------
          # Validate variables
          # ----------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($appCatalogUrl)) {
              throw "AppCatalogUrl is empty."
          }

          if ([string]::IsNullOrWhiteSpace($clientId)) {
              throw "SharePointClientId is empty."
          }

          if ([string]::IsNullOrWhiteSpace($clientSecret)) {
              throw "SharePointClientSecret is empty."
          }

          # ----------------------------------------------------
          # Connect to SharePoint
          # ----------------------------------------------------

          Write-Host "Connecting to SharePoint..."

          $connection = Connect-PnPOnline `
            -Url $appCatalogUrl `
            -ClientId $clientId `
            -ClientSecret $clientSecret `
            -ReturnConnection

          Write-Host "Connected successfully."

          # ----------------------------------------------------
          # Verify connection
          # ----------------------------------------------------

          $web = Get-PnPWeb `
            -Connection $connection `
            -ErrorAction Stop

          Write-Host "Connected SharePoint URL:"
          Write-Host $web.Url

          # ----------------------------------------------------
          # Upload and publish SPFx package
          # ----------------------------------------------------

          Write-Host "Uploading SPFx package..."

          Add-PnPApp `
            -Path $package.FullName `
            -Scope Tenant `
            -Overwrite `
            -Publish `
            -Connection $connection `
            -ErrorAction Stop

          Write-Host "========================================"
          Write-Host "SPFx deployment completed successfully."
          Write-Host "========================================"

      env:
        SP_CLIENT_SECRET: $(SharePointClientSecret)